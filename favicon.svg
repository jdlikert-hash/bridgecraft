<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bridge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Background rounded icon container -->
  <rect width="32" height="32" rx="7" fill="url(#bridge-grad)"/>
  
  <!-- Left & Right Suspension Towers -->
  <rect x="7" y="6" width="2.5" height="15" rx="0.6" fill="#ffffff"/>
  <rect x="22.5" y="6" width="2.5" height="15" rx="0.6" fill="#ffffff"/>
  <rect x="6.5" y="10" width="3.5" height="1.2" rx="0.4" fill="#c7d2fe"/>
  <rect x="22" y="10" width="3.5" height="1.2" rx="0.4" fill="#c7d2fe"/>

  <!-- Main Suspension Swoop Cables -->
  <path d="M 2 17.5 Q 7 11 8.2 8" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 8.2 8 Q 16 18.5 23.8 8" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 23.8 8 Q 25 11 30 17.5" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Vertical Suspender Struts -->
  <line x1="12" y1="13.8" x2="12" y2="19" stroke="#ffffff" stroke-width="1" stroke-opacity="0.9"/>
  <line x1="16" y1="16.8" x2="16" y2="19" stroke="#ffffff" stroke-width="1" stroke-opacity="0.9"/>
  <line x1="20" y1="13.8" x2="20" y2="19" stroke="#ffffff" stroke-width="1" stroke-opacity="0.9"/>

  <!-- Roadway Deck -->
  <rect x="2" y="19" width="28" height="2.4" rx="0.8" fill="#ffffff"/>
  <rect x="3" y="19.7" width="26" height="0.8" rx="0.4" fill="#4f46e5" opacity="0.3"/>

  <!-- Water Surface & Reflections -->
  <path d="M 5 24.5 L 11 24.5 M 14 24.5 L 21 24.5 M 24 24.5 L 27 24.5" stroke="#a5f3fc" stroke-width="1" stroke-linecap="round" opacity="0.75"/>
  <path d="M 8 27 L 13 27 M 17 27 L 24 27" stroke="#a5f3fc" stroke-width="0.9" stroke-linecap="round" opacity="0.45"/>
</svg>
